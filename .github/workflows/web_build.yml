name: WebDeployment

on:
  push:
    branches:
      - main

env:
  CI: true

jobs:
  WebDeployment:
    name: WebDeployment
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/cache@v2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

      - name: Build with Gradle
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Move Output to Directory
        run: |
          mkdir docs
          mv webApp/build/dist/js/productionExecutable/* docs/

      # Commit and push the directory to a specified branch (e.g., "output-branch")
      - name: Commit and Push to Branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Add output from build"
          git push -f origin HEAD:deploy-branch