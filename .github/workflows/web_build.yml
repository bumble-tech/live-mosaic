name: WebDeployment

on:
  push:
    branches:
      - main

env:
  CI: true

jobs:
  WebDeployment:
    name: WebDeployment
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@56b90f209b02bf6d1deae490e9ef18b21a389cd4 # v1

      - name: Build with Gradle
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Move Output to Directory
        run: |
          mkdir docs
          mv webApp/build/dist/js/productionExecutable/* docs/

      # Commit and push the directory to a specified branch (e.g., "output-branch")
      - name: Commit and Push to Branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Add output from build"
          git push -f origin HEAD:deploy-branch